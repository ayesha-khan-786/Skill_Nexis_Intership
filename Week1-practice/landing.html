<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase - Landing Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        color: #222;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }
      .navbar .logo {
        font-weight: bold;
        font-size: 1.4rem;
        color: #e11d48;
      }
      .navbar ul {
        list-style: none;
        display: flex;
        gap: 1.5rem;
      }
      .navbar a {
        text-decoration: none;
        color: #222;
        font-weight: 500;
      }
      .hero {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        padding: 4rem 2rem;
        background: #fff1f2;
      }
      .hero-text {
        flex: 1;
        min-width: 280px;
      }
      .hero-text h1 {
        font-size: 2.4rem;
        margin-bottom: 1rem;
      }
      .hero-text p {
        margin-bottom: 1.5rem;
        color: #555;
      }
      .hero-text button {
        background: #e11d48;
        color: #fff;
        border: none;
        padding: 0.9rem 1.8rem;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }
      .hero-img {
        flex: 1;
        min-width: 280px;
        text-align: center;
        font-size: 6rem;
      }
      .products {
        padding: 3rem 2rem;
        text-align: center;
      }
      .products h2 {
        margin-bottom: 2rem;
      }
      .product-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
      }
      .product-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 1.5rem;
        width: 220px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }
      .product-card .emoji {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .product-card h3 {
        margin-bottom: 0.4rem;
      }
      .price {
        color: #e11d48;
        font-weight: bold;
        margin-top: 0.5rem;
      }
      footer {
        background: #1f2937;
        color: #fff;
        text-align: center;
        padding: 1.5rem;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">ShopEase</div>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <section class="hero">
      <div class="hero-text">
        <h1>Big Sale, Bigger Savings</h1>
        <p>
          Discover trending products at unbeatable prices. Shop now and save up
          to 50%.
        </p>
        <button>Shop Now</button>
      </div>
      <div class="hero-img">🛍️</div>
    </section>
    <section class="products">
      <h2>Featured Products</h2>
      <div class="product-grid">
        <div class="product-card">
          <div class="emoji">👟</div>
          <h3>Running Shoes</h3>
          <p class="price">$49.99</p>
        </div>
        <div class="product-card">
          <div class="emoji">🎧</div>
          <h3>Headphones</h3>
          <p class="price">$29.99</p>
        </div>
        <div class="product-card">
          <div class="emoji">⌚</div>
          <h3>Smart Watch</h3>
          <p class="price">$89.99</p>
        </div>
      </div>
    </section>
    <footer><p>&copy; 2026 ShopEase. All rights reserved.</p></footer>
  </body>
</html>
